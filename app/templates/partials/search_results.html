{% if error %}
  <div class="nf-alert nf-alert-error">
    <strong>搜索失败：</strong>
    <div class="nf-alert-message">
      {{ error }}
    </div>
  </div>
{% else %}
  <div class="nf-card nf-card-result">
    <h3 class="nf-card-title">搜索结果</h3>
    <p class="nf-hint">找到 {{ results|length }} 个结果，点击选择正确的影片继续刮削。</p>

    {% if results %}
      <div class="nf-search-results">
        {% for item in results %}
          <div class="nf-search-item">
            <form
              class="nf-search-item-form"
              hx-post="/scrape/fetch"
              hx-target="#result"
              hx-swap="innerHTML"
            >
              <input type="hidden" name="url" value="{{ item.url }}" />
              <input type="hidden" name="video_path" value="{{ video_path or '' }}" />
              {% if item.poster_url %}
                <input type="hidden" name="search_poster_url" value="{{ item.poster_url }}" />
              {% endif %}
              <button type="submit" class="nf-search-item-btn nf-btn-ripple nf-btn-press">
                {% if item.poster_url %}
                  <div class="nf-search-item-poster-wrap">
                    <img src="{{ item.poster_url }}" alt="{{ item.title }}" class="nf-search-item-poster" />
                    {% if item.source %}
                      <span class="nf-search-item-source">{{ item.source }}</span>
                    {% endif %}
                  </div>
                {% else %}
                  <div class="nf-search-item-poster nf-search-item-poster-empty">
                    无图
                    {% if item.source %}
                      <span class="nf-search-item-source">{{ item.source }}</span>
                    {% endif %}
                  </div>
                {% endif %}
                <div class="nf-search-item-info">
                  <div class="nf-search-item-title">{{ item.title }}</div>
                  {% if item.number %}
                    <div class="nf-search-item-number">{{ item.number }}</div>
                  {% endif %}
                  {% if item.date %}
                    <div class="nf-search-item-date">{{ item.date }}</div>
                  {% endif %}
                </div>
              </button>
            </form>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="nf-hint">未找到相关影片，请尝试其他关键字。</p>
    {% endif %}

    <div class="nf-form-group">
      <button
        type="button"
        class="nf-button nf-button-secondary nf-btn-ripple nf-btn-press"
        onclick="document.getElementById('result').innerHTML = ''"
      >
        重新搜索
      </button>
    </div>
  </div>
{% endif %}
