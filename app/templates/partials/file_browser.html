<div class="nf-file-browser">
  <div class="nf-file-browser-header">
    <span class="nf-file-browser-title">选择服务器本地视频文件</span>
    <span class="nf-file-browser-path">{{ current_dir }}</span>
  </div>

  <div class="nf-file-browser-actions">
    <div class="nf-file-browser-actions-left">
      {% if parent_dir %}
        <button
          type="button"
          class="nf-button nf-button-secondary"
          onclick="window.nfBrowseUp('{{ parent_dir|escapejs }}', '{{ current_dir|escapejs }}')"
        >
          上级目录
        </button>
      {% endif %}
      <button
        type="button"
        class="nf-button nf-button-secondary"
          onclick="window.nfRefreshBrowser('{{ current_dir|escapejs }}')"
      >
        刷新
      </button>
      <button
        type="button"
        class="nf-button nf-button-secondary"
        onclick="window.nfCloseFileBrowser()"
      >
        关闭
      </button>
    </div>
    <div class="nf-file-browser-actions-right">
      <button
        type="button"
        class="nf-button nf-button-secondary nf-sort-btn{% if sort_by == 'name' %} nf-sort-btn-active{% endif %}"
        onclick="window.nfSetSort('name')"
      >文件名{% if sort_by == 'name' %}{% if sort_order == 'desc' %} ↓{% else %} ↑{% endif %}{% endif %}</button>
      <button
        type="button"
        class="nf-button nf-button-secondary nf-sort-btn{% if sort_by == 'natural' %} nf-sort-btn-active{% endif %}"
        onclick="window.nfSetSort('natural')"
      >自然排序{% if sort_by == 'natural' %}{% if sort_order == 'desc' %} ↓{% else %} ↑{% endif %}{% endif %}</button>
      <button
        type="button"
        class="nf-button nf-button-secondary nf-sort-btn{% if sort_by == 'mtime' %} nf-sort-btn-active{% endif %}"
        onclick="window.nfSetSort('mtime')"
      >修改时间{% if sort_by == 'mtime' %}{% if sort_order == 'desc' %} ↓{% else %} ↑{% endif %}{% endif %}</button>
    </div>
  </div>

  <div class="nf-file-browser-filter">
    <input
      type="text"
      class="nf-input nf-file-browser-search"
      placeholder="搜索过滤..."
      oninput="window.nfFilterBrowser(this)"
    />
  </div>

  <div class="nf-file-browser-list">
    {% for entry in entries %}
      <div class="nf-file-browser-item-wrapper">
        <button
          type="button"
          class="nf-file-browser-item {% if entry.is_dir %}nf-file-browser-dir{% elif entry.is_video %}nf-file-browser-video{% else %}nf-file-browser-file{% endif %}"
          data-name="{{ entry.name_lower }}"
          onclick="{% if entry.is_dir %}window.nfBrowseTo('{{ entry.path|escapejs }}'){% else %}window.nfSelectFile('{{ entry.path|escapejs }}'){% endif %}"
        >
          <span class="nf-file-browser-item-name">{{ entry.name }}</span>
          <span class="nf-file-browser-item-meta">
            {% if entry.is_dir %}目录{% else %}文件{% endif %}
          </span>
        </button>
        <button
          type="button"
          class="nf-file-browser-delete-btn"
          title="删除"
          onclick="window.nfDeleteItem('{{ entry.path|escapejs }}', event)"
        >删除</button>
      </div>
    {% else %}
      <div class="nf-file-browser-empty nf-file-browser-empty-default">此目录下没有可显示的文件或子目录。</div>
    {% endfor %}
    {% if entries %}
      <div class="nf-file-browser-empty nf-file-browser-empty-filter" style="display:none">未匹配到任何文件或目录。</div>
    {% endif %}
  </div>
</div>
