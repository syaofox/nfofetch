{% if error %}
  <div class="nf-alert nf-alert-error">
    <strong>图片预览失败：</strong>
    <div class="nf-alert-message">
      {{ error }}
    </div>
  </div>
{% endif %}

{% if poster_candidates %}
  <div class="nf-form-group">
    <p class="nf-hint">
      从下方图片中选择一张作为 <code>poster.jpg</code>（封面），以及一张作为
      <code>fanart.jpg</code>（背景图）。如不选择，将使用默认顺序。
    </p>

    <div class="nf-image-grid">
      {% for url in poster_candidates %}
        <div class="nf-image-option">
          <img
            src="{{ url }}"
            alt="候选图片 {{ loop.index }}"
            class="nf-image-thumb"
          />
          <div class="nf-image-option-controls">
            <label class="nf-img-pill">
              <input type="radio" name="poster_url" value="{{ url }}"{% if loop.index == 2 %} checked{% endif %} hidden />
              <span class="nf-img-pill-text">poster</span>
            </label>
            <label class="nf-img-pill">
              <input type="radio" name="fanart_url" value="{{ url }}"{% if loop.first %} checked{% endif %} hidden />
              <span class="nf-img-pill-text">fanart</span>
            </label>
          </div>
        </div>
      {% endfor %}
    </div>

    <div class="nf-form-group nf-write-section" style="margin-top:12px">
      <p class="nf-hint">裁切方向（仅对封面 poster 生效）：</p>
      <div class="nf-inline-fields">
      <label class="nf-label-inline nf-crop-label nf-radio-custom">
        <input type="radio" name="crop_direction" value="none" checked /> 不裁切
      </label>
      <label class="nf-label-inline nf-crop-label nf-radio-custom">
        <input type="radio" name="crop_direction" value="left" /> 左
      </label>
      <label class="nf-label-inline nf-crop-label nf-radio-custom">
        <input type="radio" name="crop_direction" value="center" /> 中
      </label>
      <label class="nf-label-inline nf-crop-label nf-radio-custom">
        <input type="radio" name="crop_direction" value="right" /> 右
      </label>
      </div>
    </div>
  </div>
{% else %}
  {% if not error %}
    <p class="nf-hint">未从该页面解析到可用图片，或暂不可用。</p>
  {% endif %}
{% endif %}
