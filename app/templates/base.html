<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NfoFetch - 影片刮削工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect x=%222%22 y=%226%22 width=%2228%22 height=%2222%22 rx=%223%22 fill=%22%23374d7c%22/><rect x=%222%22 y=%226%22 width=%2228%22 height=%227%22 rx=%223%22 fill=%22%232c3e6b%22/><circle cx=%226%22 cy=%2215.5%22 r=%221.5%22 fill=%22%23fff%22 opacity=%22.5%22/><circle cx=%226%22 cy=%2220.5%22 r=%221.5%22 fill=%22%23fff%22 opacity=%22.5%22/><circle cx=%2226%22 cy=%2215.5%22 r=%221.5%22 fill=%22%23fff%22 opacity=%22.5%22/><circle cx=%2226%22 cy=%2220.5%22 r=%221.5%22 fill=%22%23fff%22 opacity=%22.5%22/><text x=%2216%22 y=%2220%22 font-size=%229%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%23fff%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>NF</text></svg>" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@2.0.0/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body>
    <div id="nf-loading-overlay" class="nf-loading-overlay">
      <div class="nf-loading-spinner"></div>
      <div id="nf-loading-text" class="nf-loading-text">处理中…</div>
    </div>
    <div id="nf-delete-modal" class="nf-modal" style="display:none">
      <div class="nf-modal-backdrop"></div>
      <div class="nf-modal-box">
        <div class="nf-modal-title">确认删除</div>
        <div id="nf-delete-modal-path" class="nf-modal-body"></div>
        <div class="nf-modal-actions">
          <button type="button" class="nf-button nf-button-secondary" id="nf-delete-cancel-btn">取消</button>
          <button type="button" class="nf-button nf-button-danger" id="nf-delete-confirm-btn">删除</button>
        </div>
      </div>
    </div>

    <header class="nf-header">
      <div class="nf-container">
        <div class="nf-header-row">
          <div>
            <h1 class="nf-title">NfoFetch</h1>
            <p class="nf-subtitle">
              FastAPI + HTMX 影片刮削器（Jellyfin NFO，当前支持 javdb）
            </p>
          </div>
          <button type="button" class="nf-button nf-button-ghost" onclick="nfOpenCookieModal()" title="JavDB Cookie 设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main class="nf-main">
      <div class="nf-container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="nf-footer">
      <div class="nf-container nf-footer-inner">
        <small>所有 NFO 与图片都会生成在对应视频文件所在的目录下。</small>
        <small class="nf-version">v{{ version | default('0.0.0') }}</small>
      </div>
    </footer>
    <script>
      var NF_LOADING_TEXT = {
        "scrape-form": "正在搜索/刮削…",
        "write-form": "正在写入文件…",
        "nf-search-item-form": "正在刮削…",
      };

      function nfGetLoadingText(elt) {
        if (elt.id && NF_LOADING_TEXT[elt.id]) {
          return NF_LOADING_TEXT[elt.id];
        }
        if (elt.classList.contains("nf-search-item-form")) {
          return NF_LOADING_TEXT["nf-search-item-form"];
        }
        return "处理中…";
      }

      function nfShowLoading(elt) {
        var overlay = document.getElementById("nf-loading-overlay");
        var textEl = document.getElementById("nf-loading-text");
        if (overlay && textEl) {
          textEl.innerText = nfGetLoadingText(elt);
          overlay.classList.add("active");
        }
      }

      function nfHideLoading() {
        var overlay = document.getElementById("nf-loading-overlay");
        if (overlay) {
          overlay.classList.remove("active");
        }
      }

      function nfDisableFormButtons(elt) {
        if (elt.id === "scrape-form") {
          var btn = elt.querySelector("#scrape-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = true;
            btn.dataset.originalText = btn.innerText;
            btn.innerText = "处理中…";
          }
        } else if (elt.id === "write-form") {
          var btn = document.getElementById("write-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = true;
          }
        } else if (elt.classList.contains("nf-search-item-form")) {
          var btn = elt.querySelector(".nf-search-item-btn");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = true;
            btn.dataset.originalText = btn.innerHTML;
            btn.innerHTML = '<span style="color: #6b7280;">处理中…</span>';
          }
        }
      }

      function nfEnableFormButtons(elt) {
        if (elt.id === "scrape-form") {
          var btn = elt.querySelector("#scrape-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = false;
            btn.innerText = btn.dataset.originalText || "开始刮削";
          }
        } else if (elt.id === "write-form") {
          var btn = document.getElementById("write-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = false;
          }
        } else if (elt.classList.contains("nf-search-item-form")) {
          var btn = elt.querySelector(".nf-search-item-btn");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.originalText || "";
          }
        }
      }

      function nfIsRelevantForm(elt) {
        if (!(elt instanceof HTMLElement)) return false;
        if (elt.id === "scrape-form" || elt.id === "write-form") return true;
        return elt.classList.contains("nf-search-item-form");
      }

      document.addEventListener("htmx:beforeRequest", function (evt) {
        var elt = evt.detail && evt.detail.elt;
        if (!nfIsRelevantForm(elt)) return;
        if (elt.id === "scrape-form") {
          var result = document.getElementById("result");
          if (result) {
            result.innerHTML = "";
          }
        }
        nfDisableFormButtons(elt);
        nfShowLoading(elt);
      });

      document.addEventListener("htmx:afterRequest", function (evt) {
        var elt = evt.detail && evt.detail.elt;
        if (!nfIsRelevantForm(elt)) return;
        nfEnableFormButtons(elt);
        nfHideLoading();
      });

      document.addEventListener("htmx:afterSwap", function (evt) {
        var target = evt.detail && evt.detail.target;
        if (target && target.id === "result") {
          nfHideLoading();
        }
      });

      // 刮削进度轮询：劫持 write-form 提交，先获取 task_id 再提交，轮询进度
      (function () {
        var progressTimer = null;
        var currentTaskId = null;

        function pollProgress() {
          if (!currentTaskId) return;
          fetch("/api/scrape-task/" + currentTaskId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var textEl = document.getElementById("nf-loading-text");
              if (textEl) {
                textEl.textContent = data.detail || "处理中…";
                if (data.done) {
                  textEl.textContent = "处理完成";
                }
              }
              if (data.done) {
                stopPolling();
              }
            })
            .catch(function () {});
        }

        function startPolling(taskId) {
          stopPolling();
          currentTaskId = taskId;
          var textEl = document.getElementById("nf-loading-text");
          if (textEl) textEl.textContent = "正在连接…";
          progressTimer = setInterval(pollProgress, 500);
          pollProgress();
        }

        function stopPolling() {
          if (progressTimer) {
            clearInterval(progressTimer);
            progressTimer = null;
          }
          currentTaskId = null;
        }

        function injectTaskIdAndSubmit(form, taskId) {
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = "task_id";
          input.value = taskId;
          form.appendChild(input);
          htmx.trigger(form, "submit");
        }

        document.body.addEventListener("htmx:beforeRequest", function (evt) {
          var elt = evt.detail && evt.detail.elt;
          if (!elt || elt.id !== "write-form") return;
          // 首次提交（尚无 task_id）→ 拦截，先创建任务再重试
          if (!elt.querySelector("input[name='task_id']")) {
            evt.preventDefault();
            fetch("/api/scrape-task", { method: "POST" })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.task_id) {
                  startPolling(data.task_id);
                  injectTaskIdAndSubmit(elt, data.task_id);
                }
              })
              .catch(function () {
                htmx.trigger(elt, "submit");
              });
          }
        });

        document.body.addEventListener("htmx:afterRequest", function (evt) {
          var elt = evt.detail && evt.detail.elt;
          if (elt && elt.id === "write-form") {
            // 移除临时注入的 task_id，避免下次提交残留
            var ti = elt.querySelector("input[name='task_id']");
            if (ti) ti.remove();
            stopPolling();
          }
        });
      })();

      // 简单的服务器文件浏览器（自动保存最后浏览路径、排序偏好）
      (function () {
        var SETTINGS_URL = "/api/settings";
        var _browseFocusName = "";
        var _sortBy = "name";
        var _sortOrder = "asc";

        function loadBrowser(path) {
          var params = new URLSearchParams();
          if (path) {
            params.set("path", path);
          }
          params.set("sort_by", _sortBy);
          params.set("sort_order", _sortOrder);
          fetch("/browse?" + params.toString())
            .then(function (resp) {
              return resp.text();
            })
            .then(function (html) {
              var container = document.getElementById("file-browser-container");
              if (container) {
                container.innerHTML = html;
              }
              if (_browseFocusName) {
                var items = container.querySelectorAll(".nf-file-browser-item");
                var focusLower = _browseFocusName.toLowerCase();
                for (var i = 0; i < items.length; i++) {
                  if ((items[i].getAttribute("data-name") || "") === focusLower) {
                    items[i].scrollIntoView({ block: "nearest" });
                    break;
                  }
                }
                _browseFocusName = "";
              }
            })
            .catch(function () {
              // ignore
            });
        }

        function saveBrowsePath(path) {
          fetch(SETTINGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ last_browse_path: path }),
          }).catch(function () {});
        }

        function saveSortSettings() {
          fetch(SETTINGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sort_by: _sortBy, sort_order: _sortOrder }),
          }).catch(function () {});
        }

        window.nfSetSort = function (sortBy) {
          if (_sortBy === sortBy) {
            _sortOrder = (_sortOrder === "asc") ? "desc" : "asc";
          } else {
            _sortBy = sortBy;
            _sortOrder = "asc";
          }
          saveSortSettings();
          var dirEl = document.querySelector(".nf-file-browser-path");
          loadBrowser(dirEl ? dirEl.textContent.trim() : "");
        };

        window.nfOpenFileBrowser = function () {
          var input = document.getElementById("video_path");
          var initial = input && input.value ? input.value : "";
          if (!initial) {
            // 没有已选路径时，尝试从服务器恢复上次浏览位置和排序偏好
            fetch(SETTINGS_URL)
              .then(function (resp) { return resp.json(); })
              .then(function (data) {
                if (data.sort_by) _sortBy = data.sort_by;
                if (data.sort_order) _sortOrder = data.sort_order;
                loadBrowser(data.last_browse_path || "");
              })
              .catch(function () {
                loadBrowser("");
              });
          } else {
            // 输入框存的是文件路径，浏览器需要打开文件所在目录
            var idx = initial.lastIndexOf("/");
            loadBrowser(idx !== -1 ? initial.substring(0, idx) : initial);
          }
        };

        window.nfBrowseTo = function (path) {
          saveBrowsePath(path);
          loadBrowser(path);
        };

        window.nfBrowseUp = function (parentPath, currentPath) {
          var parts = currentPath.split("/");
          _browseFocusName = parts[parts.length - 1] || "";
          saveBrowsePath(parentPath);
          loadBrowser(parentPath);
        };

        window.nfSelectFile = function (path) {
          var pathInput = document.getElementById("video_path");
          if (pathInput) {
            pathInput.value = path;
          }
          // 提取文件名（不含扩展名）→ 填入搜索框
          var parts = path.split("/");
          var filename = parts[parts.length - 1] || "";
          var dotIdx = filename.lastIndexOf(".");
          if (dotIdx !== -1) {
            filename = filename.substring(0, dotIdx);
          }
          var urlInput = document.getElementById("url");
          if (urlInput && filename) {
            urlInput.value = filename;
          }
          // 保存选中文件所在目录
          var idx = path.lastIndexOf("/");
          if (idx !== -1) {
            saveBrowsePath(path.substring(0, idx));
          }
          window.nfCloseFileBrowser();
        };

        window.nfFilterBrowser = function (input) {
          var q = input.value.toLowerCase();
          var list = document.querySelector(".nf-file-browser-list");
          if (!list) return;
          var items = list.querySelectorAll(".nf-file-browser-item");
          var empty = list.querySelector(".nf-file-browser-empty");
          var visible = 0;
          for (var i = 0; i < items.length; i++) {
            var name = items[i].getAttribute("data-name") || "";
            var match = !q || name.indexOf(q) !== -1;
            items[i].style.display = match ? "" : "none";
            if (match) visible++;
          }
          if (empty) {
            empty.style.display = visible === 0 ? "" : "none";
          }
        };

        window._nfDeletePendingPath = "";

        window.nfDeleteItem = function (path, event) {
          if (event) event.stopPropagation();
          window._nfDeletePendingPath = path;
          var body = document.getElementById("nf-delete-modal-path");
          if (body) body.textContent = path;
          var modal = document.getElementById("nf-delete-modal");
          if (modal) modal.style.display = "";
        };

        document.getElementById("nf-delete-cancel-btn").addEventListener("click", function () {
          var modal = document.getElementById("nf-delete-modal");
          if (modal) modal.style.display = "none";
          window._nfDeletePendingPath = "";
        });

        document.getElementById("nf-delete-confirm-btn").addEventListener("click", function () {
          var path = window._nfDeletePendingPath;
          var modal = document.getElementById("nf-delete-modal");
          if (modal) modal.style.display = "none";
          window._nfDeletePendingPath = "";
          if (!path) return;
          var formData = new FormData();
          formData.append("path", path);
          fetch("/browse/delete", { method: "POST", body: formData })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.ok) {
                var dirEl = document.querySelector(".nf-file-browser-path");
                if (dirEl) {
                  loadBrowser(dirEl.textContent.trim());
                }
              } else {
                alert("删除失败");
              }
            })
            .catch(function () {
              alert("删除请求失败");
            });
        });

        window.nfRefreshBrowser = function (path) {
          loadBrowser(path);
        };

        window.nfCloseFileBrowser = function () {
          var container = document.getElementById("file-browser-container");
          if (container) {
            container.innerHTML = "";
          }
        };

        window.nfExtractId = function () {
          var input = document.getElementById("url");
          if (!input) return;
          var text = input.value;
          // 标准番号：ABC-123 / ABC_123
          var m = text.match(/([A-Za-z]{2,6})[-_]?(\d{2,8})/);
          if (m) {
            input.value = m[1].toUpperCase() + "-" + String(parseInt(m[2], 10)).padStart(3, "0");
            return;
          }
          // 纯数字番号：101413-455 / 101413_455
          var m2 = text.match(/(\d{4,})\s*[-_]\s*(\d{2,6})/);
          if (m2) {
            input.value = m2[1] + "-" + m2[2];
          }
        };
      })();

      window.nfOpenCookieModal = function () {
        var modal = document.getElementById("nf-cookie-modal");
        if (modal) modal.style.display = "flex";
        // 加载已保存的 cookie
        fetch("/api/settings")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var input = document.getElementById("javdb_cookie");
            if (input && data.javdb_cookie) {
              input.value = data.javdb_cookie;
            }
          })
          .catch(function () {});
      };

      window.nfCloseCookieModal = function () {
        var modal = document.getElementById("nf-cookie-modal");
        if (modal) modal.style.display = "none";
        var status = document.getElementById("nf-cookie-status");
        if (status) status.textContent = "";
      };

      window.nfToggleCookieVisibility = function () {
        var input = document.getElementById("javdb_cookie");
        if (input) {
          input.type = input.type === "password" ? "text" : "password";
        }
      };

      window.nfSaveCookie = function () {
        var input = document.getElementById("javdb_cookie");
        var status = document.getElementById("nf-cookie-status");
        if (!input || !status) return;
        var val = input.value;
        fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ javdb_cookie: val }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.ok) {
              status.textContent = "✓ 已保存";
              status.className = "nf-cookie-status";
            } else {
              status.textContent = "✗ 保存失败";
              status.className = "nf-cookie-status nf-error";
            }
          })
          .catch(function () {
            status.textContent = "✗ 保存失败";
            status.className = "nf-cookie-status nf-error";
          });
        setTimeout(function () { status.textContent = ""; }, 3000);
      };

      // 重命名格式：从服务器 JSON 文件加载，变更时自动保存
      (function () {
        var SETTINGS_URL = "/api/settings";
        var pendingTimer = null;

        function loadSettings() {
          fetch(SETTINGS_URL)
            .then(function (resp) { return resp.json(); })
            .then(function (data) {
              var rf = document.getElementById("rename_format");
              if (rf && data.rename_format) {
                rf.value = data.rename_format;
              }
              var rd = document.getElementById("rename_dir");
              if (rd && data.rename_dir) {
                rd.value = data.rename_dir;
              }
              var dc = document.getElementById("download_concurrency");
              if (dc && data.download_concurrency) {
                dc.value = data.download_concurrency;
              }
              var ck = document.getElementById("javdb_cookie");
              if (ck && data.javdb_cookie) {
                ck.value = data.javdb_cookie;
              }
            })
            .catch(function () {});
        }

        function saveSettingsField(key, value) {
          var body = {};
          body[key] = value;
          fetch(SETTINGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).catch(function () {});
        }

        // HTMX 刷新预览后，从服务器加载已保存的格式
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (evt.detail && evt.detail.target && evt.detail.target.id === "result") {
            loadSettings();
          }
        });

        // 输入变更时防抖保存
        document.body.addEventListener("input", function (evt) {
          var elt = evt.target;
          if (elt && elt.id === "rename_format") {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(function () { saveSettingsField("rename_format", elt.value); }, 300);
          }
          if (elt && elt.id === "rename_dir") {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(function () { saveSettingsField("rename_dir", elt.value); }, 300);
          }
          if (elt && elt.id === "download_concurrency") {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(function () { saveSettingsField("download_concurrency", parseInt(elt.value, 10) || 4); }, 300);
          }
        });

        // 提交前立即保存
        document.body.addEventListener("htmx:beforeRequest", function (evt) {
          var elt = evt.detail && evt.detail.elt;
          if (!elt || elt.id !== "write-form") return;
          var rf = document.getElementById("rename_format");
          if (rf) {
            saveSettingsField("rename_format", rf.value);
          }
          var rd = document.getElementById("rename_dir");
          if (rd) {
            saveSettingsField("rename_dir", rd.value);
          }
          var dc = document.getElementById("download_concurrency");
          if (dc) {
            saveSettingsField("download_concurrency", parseInt(dc.value, 10) || 4);
          }
        });

        // 页面初次加载时读取
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadSettings);
        } else {
          loadSettings();
        }
      })();

      // 重命名格式预设
      (function () {
        var PRESETS_URL = "/api/presets";
        var presetSelect = null;

        function populatePresets(data) {
          presetSelect = document.getElementById("preset-select");
          if (!presetSelect) return;
          // 保留第一个 option（"-- 选择预设 --"）
          while (presetSelect.options.length > 1) {
            presetSelect.remove(1);
          }
          // 内置预设
          var firstUser = true;
          for (var key in data.built_in) {
            var opt = document.createElement("option");
            opt.value = "built_in:" + key;
            opt.textContent = key;
            presetSelect.appendChild(opt);
          }
          // 用户自定义预设
          for (var key in data.user) {
            if (firstUser) {
              var sep = document.createElement("option");
              sep.disabled = true;
              sep.textContent = "── 我的预设 ──";
              presetSelect.appendChild(sep);
              firstUser = false;
            }
            var opt = document.createElement("option");
            opt.value = "user:" + key;
            opt.textContent = key;
            presetSelect.appendChild(opt);
          }
        }

        function loadPresets() {
          fetch(PRESETS_URL)
            .then(function (r) { return r.json(); })
            .then(populatePresets)
            .catch(function () {});
        }

        window.nfApplyPreset = function (value) {
          if (!value) return;
          fetch(PRESETS_URL)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var preset;
              if (value.indexOf("built_in:") === 0) {
                preset = data.built_in[value.slice(9)];
              } else if (value.indexOf("user:") === 0) {
                preset = data.user[value.slice(5)];
              }
              if (!preset) return;
              var rf = document.getElementById("rename_format");
              var rd = document.getElementById("rename_dir");
              if (rf) rf.value = preset.rename_format;
              if (rd && preset.rename_dir) rd.value = preset.rename_dir;
            })
            .catch(function () {});
        };

        window.nfSavePreset = function () {
          var rf = document.getElementById("rename_format");
          var rd = document.getElementById("rename_dir");
          // 先确保服务器上的 rename_format / rename_dir 是最新的
          if (rf) saveSettingsField("rename_format", rf.value);
          if (rd) saveSettingsField("rename_dir", rd.value);
          var name = prompt("请输入预设名称：");
          if (!name || name.trim() === "") return;
          var formData = new FormData();
          formData.append("name", name.trim());
          formData.append("rename_format", rf ? rf.value : "");
          formData.append("rename_dir", rd ? rd.value : "");
          fetch(PRESETS_URL, {
            method: "POST",
            body: formData,
          }).then(function () {
            loadPresets();
          }).catch(function () {});
        };

        window.nfDeletePreset = function () {
          var sel = document.getElementById("preset-select");
          if (!sel || !sel.value) return;
          if (sel.value.indexOf("user:") !== 0) return;
          var name = sel.options[sel.selectedIndex].textContent;
          if (!confirm('确定删除预设"' + name + '"？')) return;
          fetch(PRESETS_URL + "?name=" + encodeURIComponent(name), {
            method: "DELETE",
          }).then(function () {
            loadPresets();
          }).catch(function () {});
        };

        // 在 settings 加载后也加载预设
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (evt.detail && evt.detail.target && evt.detail.target.id === "result") {
            setTimeout(loadPresets, 50);
          }
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadPresets);
        } else {
          loadPresets();
        }
      })();

      // 图片单击设 poster，双击设 fanart
      (function () {
        document.body.addEventListener("click", function (e) {
          var thumb = e.target.closest(".nf-image-thumb");
          if (!thumb) return;
          var option = thumb.closest(".nf-image-option");
          if (!option) return;

          if (option._clickTimer) {
            clearTimeout(option._clickTimer);
            option._clickTimer = null;
            var fanartRadio = option.querySelector(
              "input[name='fanart_url']"
            );
            if (fanartRadio) fanartRadio.checked = true;
          } else {
            option._clickTimer = setTimeout(function () {
              option._clickTimer = null;
              var posterRadio = option.querySelector(
                "input[name='poster_url']"
              );
              if (posterRadio) posterRadio.checked = true;
            }, 250);
          }
        });
      })();
    </script>
  </body>
</html>
