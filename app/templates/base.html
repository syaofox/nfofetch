<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NfoFetch - 影片刮削工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@2.0.0/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  </head>
  <body>
    <div id="nf-loading-overlay" class="nf-loading-overlay">
      <div class="nf-loading-spinner"></div>
      <div id="nf-loading-text" class="nf-loading-text">处理中…</div>
      <div class="nf-loading-dots">
        <div class="nf-loading-dot"></div>
        <div class="nf-loading-dot"></div>
        <div class="nf-loading-dot"></div>
      </div>
    </div>
    <div id="nf-delete-modal" class="nf-modal" style="display:none">
      <div class="nf-modal-backdrop"></div>
      <div class="nf-modal-box">
        <div class="nf-modal-title">确认删除</div>
        <div id="nf-delete-modal-path" class="nf-modal-body"></div>
        <div class="nf-modal-actions">
          <button type="button" class="nf-button nf-button-secondary nf-btn-ripple nf-btn-press" id="nf-delete-cancel-btn">取消</button>
          <button type="button" class="nf-button nf-button-danger nf-btn-ripple nf-btn-press" id="nf-delete-confirm-btn">删除</button>
        </div>
      </div>
    </div>

    <header class="nf-header">
      <div class="nf-container">
        <div class="nf-header-row">
          <div>
            <h1 class="nf-title">NfoFetch</h1>
            <p class="nf-subtitle">
               影片刮削器（Jellyfin NFO）
            </p>
          </div>
          <button type="button" class="nf-button-ghost" onclick="nfOpenSettingsModal()" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main class="nf-main">
      <div class="nf-container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="nf-footer">
      <div class="nf-container nf-footer-inner">
        <small>所有 NFO 与图片都会生成在对应视频文件所在的目录下。</small>
        <small class="nf-version">v{{ version | default('0.0.0') }}</small>
      </div>
    </footer>
    <script>
      var NF_LOADING_TEXT = {
        "scrape-form": "正在搜索/刮削…",
        "write-form": "正在写入文件…",
        "nf-search-item-form": "正在刮削…",
      };

      function nfGetLoadingText(elt) {
        if (elt.id && NF_LOADING_TEXT[elt.id]) {
          return NF_LOADING_TEXT[elt.id];
        }
        if (elt.classList.contains("nf-search-item-form")) {
          return NF_LOADING_TEXT["nf-search-item-form"];
        }
        return "处理中…";
      }

      function nfShowLoading(elt) {
        var overlay = document.getElementById("nf-loading-overlay");
        var textEl = document.getElementById("nf-loading-text");
        if (overlay && textEl) {
          textEl.innerText = nfGetLoadingText(elt);
          overlay.classList.add("active");
        }
      }

      function nfHideLoading() {
        var overlay = document.getElementById("nf-loading-overlay");
        if (overlay) {
          overlay.classList.remove("active");
        }
      }

      function nfDisableFormButtons(elt) {
        if (elt.id === "scrape-form") {
          var btn = elt.querySelector("#scrape-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = true;
            btn.dataset.originalText = btn.innerText;
            btn.innerText = "处理中…";
          }
        } else if (elt.id === "write-form") {
          var btn = document.getElementById("write-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = true;
          }
        } else if (elt.classList.contains("nf-search-item-form")) {
          var btn = elt.querySelector(".nf-search-item-btn");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = true;
            btn.dataset.originalText = btn.innerHTML;
            btn.innerHTML = '<span style="color: #6b7280;">处理中…</span>';
          }
        }
      }

      function nfEnableFormButtons(elt) {
        if (elt.id === "scrape-form") {
          var btn = elt.querySelector("#scrape-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = false;
            btn.innerText = btn.dataset.originalText || "开始刮削";
          }
        } else if (elt.id === "write-form") {
          var btn = document.getElementById("write-button");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = false;
          }
        } else if (elt.classList.contains("nf-search-item-form")) {
          var btn = elt.querySelector(".nf-search-item-btn");
          if (btn instanceof HTMLButtonElement) {
            btn.disabled = false;
            btn.innerHTML = btn.dataset.originalText || "";
          }
        }
      }

      function nfIsRelevantForm(elt) {
        if (!(elt instanceof HTMLElement)) return false;
        if (elt.id === "scrape-form" || elt.id === "write-form") return true;
        return elt.classList.contains("nf-search-item-form");
      }

      document.addEventListener("htmx:beforeRequest", function (evt) {
        var elt = evt.detail && evt.detail.elt;
        if (!nfIsRelevantForm(elt)) return;
        if (elt.id === "scrape-form") {
          var result = document.getElementById("result");
          if (result) {
            result.innerHTML = "";
          }
        }
        nfDisableFormButtons(elt);
        nfShowLoading(elt);
      });

      document.addEventListener("htmx:afterRequest", function (evt) {
        var elt = evt.detail && evt.detail.elt;
        if (!nfIsRelevantForm(elt)) return;
        nfEnableFormButtons(elt);
        nfHideLoading();
      });

      document.addEventListener("htmx:afterSwap", function (evt) {
        var target = evt.detail && evt.detail.target;
        if (target && target.id === "result") {
          nfHideLoading();
        }
      });

      // 刮削进度轮询：劫持 write-form 提交，先获取 task_id 再提交，轮询进度
      (function () {
        var progressTimer = null;
        var currentTaskId = null;

        function pollProgress() {
          if (!currentTaskId) return;
          fetch("/api/scrape-task/" + currentTaskId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var textEl = document.getElementById("nf-loading-text");
              if (textEl) {
                textEl.textContent = data.detail || "处理中…";
                if (data.done) {
                  textEl.textContent = "处理完成";
                }
              }
              if (data.done) {
                stopPolling();
              }
            })
            .catch(function () {});
        }

        function startPolling(taskId) {
          stopPolling();
          currentTaskId = taskId;
          var textEl = document.getElementById("nf-loading-text");
          if (textEl) textEl.textContent = "正在连接…";
          progressTimer = setInterval(pollProgress, 500);
          pollProgress();
        }

        function stopPolling() {
          if (progressTimer) {
            clearInterval(progressTimer);
            progressTimer = null;
          }
          currentTaskId = null;
        }

        function injectTaskIdAndSubmit(form, taskId) {
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = "task_id";
          input.value = taskId;
          form.appendChild(input);
          htmx.trigger(form, "submit");
        }

        document.body.addEventListener("htmx:beforeRequest", function (evt) {
          var elt = evt.detail && evt.detail.elt;
          if (!elt || elt.id !== "write-form") return;
          // 首次提交（尚无 task_id）→ 拦截，先创建任务再重试
          if (!elt.querySelector("input[name='task_id']")) {
            evt.preventDefault();
            fetch("/api/scrape-task", { method: "POST" })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.task_id) {
                  startPolling(data.task_id);
                  injectTaskIdAndSubmit(elt, data.task_id);
                }
              })
              .catch(function () {
                htmx.trigger(elt, "submit");
              });
          }
        });

        document.body.addEventListener("htmx:afterRequest", function (evt) {
          var elt = evt.detail && evt.detail.elt;
          if (elt && elt.id === "write-form") {
            // 移除临时注入的 task_id，避免下次提交残留
            var ti = elt.querySelector("input[name='task_id']");
            if (ti) ti.remove();
            stopPolling();
          }
        });
      })();

      // 简单的服务器文件浏览器（自动保存最后浏览路径、排序偏好）
      (function () {
        var SETTINGS_URL = "/api/settings";
        var _browseFocusName = "";
        var _sortBy = "name";
        var _sortOrder = "asc";

        function loadBrowser(path) {
          var params = new URLSearchParams();
          if (path) {
            params.set("path", path);
          }
          params.set("sort_by", _sortBy);
          params.set("sort_order", _sortOrder);
          fetch("/browse?" + params.toString())
            .then(function (resp) {
              return resp.text();
            })
            .then(function (html) {
              var container = document.getElementById("file-browser-container");
              if (container) {
                container.innerHTML = html;
              }
              if (_browseFocusName) {
                var items = container.querySelectorAll(".nf-file-browser-item");
                var focusLower = _browseFocusName.toLowerCase();
                for (var i = 0; i < items.length; i++) {
                  if ((items[i].getAttribute("data-name") || "") === focusLower) {
                    items[i].scrollIntoView({ block: "nearest" });
                    break;
                  }
                }
                _browseFocusName = "";
              }
            })
            .catch(function () {
              // ignore
            });
        }

        function saveBrowsePath(path) {
          fetch(SETTINGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ last_browse_path: path }),
          }).catch(function () {});
        }

        function saveSortSettings() {
          fetch(SETTINGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sort_by: _sortBy, sort_order: _sortOrder }),
          }).catch(function () {});
        }

        window.nfSetSort = function (sortBy) {
          if (_sortBy === sortBy) {
            _sortOrder = (_sortOrder === "asc") ? "desc" : "asc";
          } else {
            _sortBy = sortBy;
            _sortOrder = "asc";
          }
          saveSortSettings();
          var dirEl = document.querySelector(".nf-file-browser-path");
          loadBrowser(dirEl ? dirEl.textContent.trim() : "");
        };

        window.nfOpenFileBrowser = function () {
          var input = document.getElementById("video_path");
          var initial = input && input.value ? input.value : "";
          if (!initial) {
            // 没有已选路径时，尝试从服务器恢复上次浏览位置和排序偏好
            fetch(SETTINGS_URL)
              .then(function (resp) { return resp.json(); })
              .then(function (data) {
                if (data.sort_by) _sortBy = data.sort_by;
                if (data.sort_order) _sortOrder = data.sort_order;
                loadBrowser(data.last_browse_path || "");
              })
              .catch(function () {
                loadBrowser("");
              });
          } else {
            // 输入框存的是文件路径，浏览器需要打开文件所在目录
            var idx = initial.lastIndexOf("/");
            loadBrowser(idx !== -1 ? initial.substring(0, idx) : initial);
          }
        };

        window.nfBrowseTo = function (path) {
          saveBrowsePath(path);
          loadBrowser(path);
        };

        window.nfBrowseUp = function (parentPath, currentPath) {
          var parts = currentPath.split("/");
          _browseFocusName = parts[parts.length - 1] || "";
          saveBrowsePath(parentPath);
          loadBrowser(parentPath);
        };

        window.nfSelectFile = function (path) {
          var pathInput = document.getElementById("video_path");
          if (pathInput) {
            pathInput.value = path;
          }
          // 提取文件名（不含扩展名）→ 填入搜索框
          var parts = path.split("/");
          var filename = parts[parts.length - 1] || "";
          var dotIdx = filename.lastIndexOf(".");
          if (dotIdx !== -1) {
            filename = filename.substring(0, dotIdx);
          }
          var urlInput = document.getElementById("url");
          if (urlInput && filename) {
            urlInput.value = filename;
          }
          // 保存选中文件所在目录
          var idx = path.lastIndexOf("/");
          if (idx !== -1) {
            saveBrowsePath(path.substring(0, idx));
          }
          window.nfCloseFileBrowser();
        };

        window.nfFilterBrowser = function (input) {
          var q = input.value.toLowerCase();
          var list = document.querySelector(".nf-file-browser-list");
          if (!list) return;
          var items = list.querySelectorAll(".nf-file-browser-item");
          var empty = list.querySelector(".nf-file-browser-empty");
          var visible = 0;
          for (var i = 0; i < items.length; i++) {
            var name = items[i].getAttribute("data-name") || "";
            var match = !q || name.indexOf(q) !== -1;
            items[i].parentElement.style.display = match ? "" : "none";
            if (match) visible++;
          }
          if (empty) {
            empty.style.display = visible === 0 ? "" : "none";
          }
        };

        window._nfDeletePendingPath = "";

        window.nfDeleteItem = function (path, event) {
          if (event) event.stopPropagation();
          window._nfDeletePendingPath = path;
          var body = document.getElementById("nf-delete-modal-path");
          if (body) body.textContent = path;
          var modal = document.getElementById("nf-delete-modal");
          if (modal) modal.style.display = "";
        };

        document.getElementById("nf-delete-cancel-btn").addEventListener("click", function () {
          var modal = document.getElementById("nf-delete-modal");
          if (modal) modal.style.display = "none";
          window._nfDeletePendingPath = "";
        });

        document.getElementById("nf-delete-confirm-btn").addEventListener("click", function () {
          var path = window._nfDeletePendingPath;
          var modal = document.getElementById("nf-delete-modal");
          if (modal) modal.style.display = "none";
          window._nfDeletePendingPath = "";
          if (!path) return;
          var formData = new FormData();
          formData.append("path", path);
          fetch("/browse/delete", { method: "POST", body: formData })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.ok) {
                var dirEl = document.querySelector(".nf-file-browser-path");
                if (dirEl) {
                  loadBrowser(dirEl.textContent.trim());
                }
              } else {
                alert("删除失败");
              }
            })
            .catch(function () {
              alert("删除请求失败");
            });
        });

        window.nfRefreshBrowser = function (path) {
          loadBrowser(path);
        };

        window.nfViewFile = function (path, event) {
          if (event) event.stopPropagation();
          window.open("/file?path=" + encodeURIComponent(path), "_blank");
        };

        // --- 精确裁切 ---
        var _nfCropper = null;

        function _cropperOpts(img) {
          var halfW = Math.floor(img.naturalWidth / 2);
          return {
            aspectRatio: NaN, viewMode: 1, dragMode: "crop",
            autoCrop: true, autoCropArea: 0.8,
            responsive: true, restore: false,
            guides: true, center: true, highlight: false, background: true,
            movable: true, rotatable: false, scalable: false,
            zoomable: true, zoomOnTouch: true, zoomOnWheel: true,
            data: { x: img.naturalWidth - halfW, y: 0, width: halfW, height: img.naturalHeight },
          };
        }

        function _destroyCropper() {
          if (_nfCropper) { _nfCropper.destroy(); _nfCropper = null; }
        }

        function _loadImageToCropper(src) {
          var img = document.getElementById("nf-crop-image");
          if (!img) return;
          _destroyCropper();
          img.src = src;
          img.onload = function () {
            _nfCropper = new Cropper(img, _cropperOpts(img));
            document.getElementById("nf-crop-drop-hint").textContent =
              img.naturalWidth + "×" + img.naturalHeight + " — 拖拽/粘贴可替换";
          };
        }

        window.nfOpenCropModal = function (btn) {
          var checkedRadio = document.querySelector('input[name="poster_url"]:checked');
          var imgUrl = checkedRadio ? checkedRadio.value : (btn.getAttribute("data-poster-url") || "");
          var modal = document.getElementById("nf-crop-modal");
          if (!modal) return;
          modal.style.display = "flex";
          modal.querySelector(".nf-crop-dropzone").classList.remove("drag-over");
          var trimCb = document.getElementById("auto_trim_white_borders");
          var autoTrim = trimCb ? trimCb.checked : false;
          var cropUrl = "/api/crop-image?url=" + encodeURIComponent(imgUrl) + "&auto_trim=" + (autoTrim ? "1" : "0");
          _loadImageToCropper(cropUrl);
        };

        // 拖拽支持
        document.addEventListener("dragenter", function (e) {
          var dz = document.getElementById("nf-crop-dropzone");
          if (dz && dz.offsetParent !== null) dz.classList.add("drag-over");
        });
        document.addEventListener("dragleave", function (e) {
          var dz = document.getElementById("nf-crop-dropzone");
          if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove("drag-over");
        });
        document.addEventListener("dragover", function (e) { e.preventDefault(); });
        document.addEventListener("drop", function (e) {
          var dz = document.getElementById("nf-crop-dropzone");
          if (!dz || dz.offsetParent === null) return;
          e.preventDefault();
          dz.classList.remove("drag-over");
          var file = e.dataTransfer.files[0];
          if (!file || !file.type.startsWith("image/")) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            _loadImageToCropper(ev.target.result);
            // 上传文件到服务器，保存为自定义 poster 路径
            var formData = new FormData();
            formData.append("file", file);
            fetch("/api/upload-poster", { method: "POST", body: formData })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.path) {
                  document.getElementById("custom_poster_path").value = data.path;
                }
              })
              .catch(function () {});
          };
          reader.readAsDataURL(file);
        });
        // 粘贴支持（裁剪弹窗或上传区）
        document.addEventListener("paste", function (e) {
          var items = e.clipboardData && e.clipboardData.items;
          if (!items) return;
          // 检测是裁剪弹窗模式还是上传区模式
          var dz = document.getElementById("nf-crop-dropzone");
          var zone = document.getElementById("nf-upload-zone");
          var isCrop = dz && dz.offsetParent !== null;
          var isUpload = zone && zone.offsetParent !== null;
          if (!isCrop && !isUpload) return;
          for (var i = 0; i < items.length; i++) {
            if (items[i].type.startsWith("image/")) {
              var blob = items[i].getAsFile();
              if (!blob) continue;
              if (isCrop) {
                var reader = new FileReader();
                reader.onload = function (ev) {
                  _loadImageToCropper(ev.target.result);
                  var pasteFile = new File([blob], "pasted.png", { type: blob.type });
                  var formData = new FormData();
                  formData.append("file", pasteFile);
                  fetch("/api/upload-poster", { method: "POST", body: formData })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                      if (data.path) {
                        document.getElementById("custom_poster_path").value = data.path;
                      }
                    })
                    .catch(function () {});
                };
                reader.readAsDataURL(blob);
              } else {
                window.nfUploadImage(new File([blob], "pasted.png", { type: blob.type }));
              }
              break;
            }
          }
        });

        window.nfCloseCropModal = function () {
          if (_nfCropper) {
            _nfCropper.destroy();
            _nfCropper = null;
          }
          var modal = document.getElementById("nf-crop-modal");
          if (modal) modal.style.display = "none";
        };

        window.nfSwitchCropTab = function (tab) {
          var dirPanel = document.getElementById("nf-crop-panel-direction");
          var prePanel = document.getElementById("nf-crop-panel-precise");
          var tabs = document.querySelectorAll(".nf-crop-tab");
          tabs.forEach(function (t) { t.classList.remove("nf-crop-tab-active"); });
          var coverImg = document.querySelector('.nf-meta-poster-img');
          var poster = document.querySelector('input[name="poster_url"]:checked');
          var imgUrl = poster ? poster.value : '';
          if (tab === "direction") {
            dirPanel.style.display = "";
            prePanel.style.display = "none";
            tabs[0].classList.add("nf-crop-tab-active");
            // 清除精确裁切数据
            document.getElementById("crop_x").value = "0";
            document.getElementById("crop_y").value = "0";
            document.getElementById("crop_w").value = "0";
            document.getElementById("crop_h").value = "0";
            document.getElementById("custom_poster_path").value = "";
            var btn = document.getElementById("nf-crop-btn");
            if (btn) { btn.classList.remove("nf-crop-btn-active"); btn.textContent = "选择裁切区域…"; }
            var smallPreview = document.getElementById("nf-crop-preview");
            if (smallPreview) { smallPreview.style.display = "none"; smallPreview.src = ""; }
            window._nfCanvasPreviewActive = false;
            // 方向裁切预览
            if (window.nfUpdateDirectionPreview) window.nfUpdateDirectionPreview();
          } else {
            dirPanel.style.display = "none";
            prePanel.style.display = "";
            tabs[1].classList.add("nf-crop-tab-active");
            // 切到精确裁切时，封面预览恢复原始图片
            if (coverImg && imgUrl) {
              coverImg.src = imgUrl;
              coverImg.style.objectPosition = 'center';
            }
          }
        };

        window.nfUpdateDirectionPreview = function () {
          var dir = document.querySelector('input[name="crop_direction"]:checked');
          var poster = document.querySelector('input[name="poster_url"]:checked');
          var imgUrl = poster ? poster.value : '';
          var coverImg = document.querySelector('.nf-meta-poster-img');
          if (!coverImg || !imgUrl) return;
          var prePanel = document.getElementById('nf-crop-panel-precise');
          var preciseActive = prePanel && prePanel.style.display !== 'none';
          if (preciseActive || window._nfCanvasPreviewActive) return;
          if (dir && dir.value !== 'none') {
            coverImg.src = imgUrl;
            coverImg.style.objectPosition = dir.value;
          } else {
            coverImg.src = imgUrl;
            coverImg.style.objectPosition = 'center';
          }
        };

        // 封面预览同步：监听 poster/crop 变更
        (function () {
          document.body.addEventListener('change', function (e) {
            if (e.target.matches && e.target.matches('input[name="crop_direction"]')) {
              if (window.nfUpdateDirectionPreview) window.nfUpdateDirectionPreview();
            }
            if (e.target.matches && e.target.matches('input[name="poster_url"]')) {
              // 切换 poster 时清除精确裁切
              var cropX = document.getElementById('crop_x');
              if (cropX && cropX.value !== '0') {
                document.getElementById('crop_x').value = '0';
                document.getElementById('crop_y').value = '0';
                document.getElementById('crop_w').value = '0';
                document.getElementById('crop_h').value = '0';
                document.getElementById('custom_poster_path').value = '';
                var btn = document.getElementById('nf-crop-btn');
                if (btn) { btn.classList.remove('nf-crop-btn-active'); btn.textContent = '选择裁切区域…'; }
                var smallPreview = document.getElementById('nf-crop-preview');
                if (smallPreview) { smallPreview.style.display = 'none'; smallPreview.src = ''; }
                window._nfCanvasPreviewActive = false;
              }
              if (window.nfUpdateDirectionPreview) window.nfUpdateDirectionPreview();
            }
          });
        })();

        // 页面加载时封面预览同步到已选的 poster
        (function () {
          var poster = document.querySelector('input[name="poster_url"]:checked');
          var coverImg = document.querySelector('.nf-meta-poster-img');
          if (poster && coverImg) {
            coverImg.src = poster.value;
          }
        })();

        window.nfConfirmCrop = function () {
          if (!_nfCropper) return;
          var data = _nfCropper.getData(true);
          var w = Math.round(data.width);
          var h = Math.round(data.height);
          document.getElementById("crop_x").value = Math.round(data.x);
          document.getElementById("crop_y").value = Math.round(data.y);
          document.getElementById("crop_w").value = w;
          document.getElementById("crop_h").value = h;
          var btn = document.getElementById("nf-crop-btn");
          if (btn) {
            btn.classList.add("nf-crop-btn-active");
            btn.textContent = "已裁切 " + w + "×" + h;
          }
          // 小缩略图
          var thumbCanvas = _nfCropper.getCroppedCanvas({ maxWidth: 80, maxHeight: 80 });
          var preview = document.getElementById("nf-crop-preview");
          if (preview && thumbCanvas) {
            preview.src = thumbCanvas.toDataURL();
            preview.style.display = "inline-block";
          }
          // 封面预览大图
          var coverImg = document.querySelector('.nf-meta-poster-img');
          if (coverImg) {
            var coverCanvas = _nfCropper.getCroppedCanvas({ maxWidth: 320, maxHeight: 480 });
            if (coverCanvas) {
              coverImg.src = coverCanvas.toDataURL();
              coverImg.style.objectPosition = 'center';
              window._nfCanvasPreviewActive = true;
            }
          }
          window.nfCloseCropModal();
        };

        window.nfCloseFileBrowser = function () {
          var container = document.getElementById("file-browser-container");
          if (container) {
            container.innerHTML = "";
          }
        };

        window.nfExtractId = function () {
          var input = document.getElementById("url");
          if (!input) return;

          function _closePopup() {
            var popup = document.getElementById("nf-id-popup");
            if (popup) popup.remove();
          }

          function _pick(id) {
            input.value = id;
            _closePopup();
          }

          _closePopup();
          var text = input.value;
          var ids = [];

          // 标准番号：ABC-123 / ABC_123
          var reStd = /([A-Za-z]{2,6})[-_]?(\d{2,8})/g;
          var m;
          while ((m = reStd.exec(text)) !== null) {
            ids.push(m[1].toUpperCase() + "-" + String(parseInt(m[2], 10)).padStart(3, "0"));
          }
          // 纯数字番号：101413-455（连字符版）
          var reNumH = /(\d{4,})\s*-\s*(\d{2,6})/g;
          while ((m = reNumH.exec(text)) !== null) {
            ids.push(m[1] + "-" + m[2]);
          }
          // 纯数字番号：101413_455（下划线版，与连字符版为不同番号）
          var reNumU = /(\d{4,})\s*_\s*(\d{2,6})/g;
          while ((m = reNumU.exec(text)) !== null) {
            ids.push(m[1] + "_" + m[2]);
          }
          // n 前缀番号：n0179 / N0179
          var reN = /n(\d{2,8})/gi;
          while ((m = reN.exec(text)) !== null) {
            ids.push("N" + m[1]);
          }
          // 去重
          ids = ids.filter(function (v, i) { return ids.indexOf(v) === i; });

          if (ids.length === 0) return;
          if (ids.length === 1) { input.value = ids[0]; return; }

          // 多匹配 → 弹出选择
          var rect = input.getBoundingClientRect();
          var popup = document.createElement("div");
          popup.id = "nf-id-popup";
          popup.className = "nf-id-popup";
          popup.style.cssText = "top:" + (rect.bottom + window.scrollY + 4) + "px;left:" + (rect.left + window.scrollX) + "px;min-width:" + Math.max(rect.width, 200) + "px";
          var title = document.createElement("div");
          title.className = "nf-id-popup-title";
          title.textContent = "选择番号：";
          popup.appendChild(title);
          ids.forEach(function (id) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "nf-id-popup-item";
            btn.textContent = id;
            btn.onclick = function () { _pick(id); };
            popup.appendChild(btn);
          });
          var closeBtn = document.createElement("button");
          closeBtn.type = "button";
          closeBtn.className = "nf-id-popup-close";
          closeBtn.textContent = "取消";
          closeBtn.onclick = _closePopup;
          popup.appendChild(closeBtn);
          document.body.appendChild(popup);
          // 点击外部关闭
          setTimeout(function () {
            document.addEventListener("click", function _handler(e) {
              if (!popup.contains(e.target) && e.target !== input) {
                _closePopup();
                document.removeEventListener("click", _handler);
              }
            });
          }, 0);
        };
      })();

      window.nfOpenSettingsModal = function () {
        var modal = document.getElementById("nf-settings-modal");
        if (modal) modal.style.display = "flex";
        fetch("/api/settings")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var cookieInput = document.getElementById("javdb_cookie");
            if (cookieInput && data.javdb_cookie) {
              cookieInput.value = data.javdb_cookie;
            }
            var jcInput = document.getElementById("jav321_cookie");
            if (jcInput && data.jav321_cookie) {
              jcInput.value = data.jav321_cookie;
            }
            var dcInput = document.getElementById("dmm_cookie");
            if (dcInput && data.dmm_cookie) {
              dcInput.value = data.dmm_cookie;
            }
            var serialCb = document.getElementById("serial_writes");
            if (serialCb && data.serial_writes !== null) {
              serialCb.checked = data.serial_writes;
            } else if (serialCb) {
              serialCb.checked = false;
            }
            var lockCb = document.getElementById("lock_enabled");
            if (lockCb && data.lock_enabled !== null) {
              lockCb.checked = data.lock_enabled;
            } else if (lockCb) {
              lockCb.checked = false;
            }
            var wd = document.getElementById("write_delay");
            if (wd && data.write_delay !== null) {
              wd.value = data.write_delay;
            }
            var mx = document.getElementById("max_extra_images");
            if (mx && data.max_extra_images !== null) {
              mx.value = data.max_extra_images;
            }
            var delCb = document.getElementById("delete_orphan_extrafanart");
            if (delCb && data.delete_orphan_extrafanart !== null) {
              delCb.checked = data.delete_orphan_extrafanart;
            } else if (delCb) {
              delCb.checked = false;
            }
            var genderCb = document.getElementById("filter_actor_gender");
            if (genderCb && data.filter_actor_gender !== null) {
              genderCb.checked = data.filter_actor_gender;
            } else if (genderCb) {
              genderCb.checked = true;
            }
            var dc = document.getElementById("download_concurrency");
            if (dc && data.download_concurrency !== null) {
              dc.value = data.download_concurrency;
            }
            var trimCb = document.getElementById("auto_trim_white_borders");
            if (trimCb && data.auto_trim_white_borders !== null) {
              trimCb.checked = data.auto_trim_white_borders;
            } else if (trimCb) {
              trimCb.checked = false;
            }
            // scraper 开关
            var scraperNames = ["javdb", "jav321", "javhoo"];
            var enabledList = data.enabled_scrapers;
            for (var si = 0; si < scraperNames.length; si++) {
              var scb = document.getElementById("scraper_" + scraperNames[si]);
              if (scb) {
                scb.checked = enabledList === null || enabledList.indexOf(scraperNames[si]) !== -1;
              }
            }
          })
          .catch(function () {});
      };

      window.nfCloseSettingsModal = function () {
        var modal = document.getElementById("nf-settings-modal");
        if (modal) modal.style.display = "none";
        var status = document.getElementById("nf-settings-status");
        if (status) status.textContent = "";
      };

      window.nfToggleCookieVisibility = function () {
        var input = document.getElementById("javdb_cookie");
        if (input) {
          input.type = input.type === "password" ? "text" : "password";
        }
      };

      window.nfToggleJav321CookieVisibility = function () {
        var input = document.getElementById("jav321_cookie");
        if (input) {
          input.type = input.type === "password" ? "text" : "password";
        }
      };

      window.nfToggleDmmCookieVisibility = function () {
        var input = document.getElementById("dmm_cookie");
        if (input) {
          input.type = input.type === "password" ? "text" : "password";
        }
      };

      window.nfSaveSettings = function () {
        var cookieInput = document.getElementById("javdb_cookie");
        var jcInput = document.getElementById("jav321_cookie");
        var serialCb = document.getElementById("serial_writes");
        var lockCb = document.getElementById("lock_enabled");
        var wd = document.getElementById("write_delay");
        var mx = document.getElementById("max_extra_images");
        var delCb = document.getElementById("delete_orphan_extrafanart");
        var genderCb = document.getElementById("filter_actor_gender");
        var trimCb = document.getElementById("auto_trim_white_borders");
        var dc = document.getElementById("download_concurrency");
        var status = document.getElementById("nf-settings-status");
        if (!status) return;
        var body = {
          javdb_cookie: cookieInput ? cookieInput.value : "",
          jav321_cookie: jcInput ? jcInput.value : "",
          dmm_cookie: document.getElementById("dmm_cookie") ? document.getElementById("dmm_cookie").value : "",
          serial_writes: serialCb ? serialCb.checked : false,
          lock_enabled: lockCb ? lockCb.checked : false,
          write_delay: wd && wd.value !== "" ? parseFloat(wd.value) : null,
          max_extra_images: mx && mx.value !== "" ? parseInt(mx.value, 10) : null,
          delete_orphan_extrafanart: delCb ? delCb.checked : false,
          filter_actor_gender: genderCb ? genderCb.checked : true,
          auto_trim_white_borders: trimCb ? trimCb.checked : false,
          download_concurrency: dc && dc.value !== "" ? parseInt(dc.value, 10) : null,
          move_to_subdir: document.getElementById("move_to_subdir") ? document.getElementById("move_to_subdir").checked : undefined,
          enabled_scrapers: (function () {
            var scraperNames = ["javdb", "jav321", "javhoo", "dmm"];
            var enabled = [];
            for (var si = 0; si < scraperNames.length; si++) {
              var scb = document.getElementById("scraper_" + scraperNames[si]);
              if (scb && scb.checked) enabled.push(scraperNames[si]);
            }
            return enabled;
          })(),
        };
        fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.ok) {
              status.innerHTML = '<span class="nf-status-icon nf-status-success"><svg class="w-3 h-3" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></span> 已保存';
              status.className = "nf-settings-status";
            } else {
              status.innerHTML = '<span class="nf-status-icon nf-status-error"><svg class="w-3 h-3" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span> 保存失败';
              status.className = "nf-settings-status nf-error";
            }
          })
          .catch(function () {
            status.innerHTML = '<span class="nf-status-icon nf-status-error"><svg class="w-3 h-3" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span> 保存失败';
            status.className = "nf-settings-status nf-error";
          });
        setTimeout(function () { status.innerHTML = ""; }, 3000);
      };

      // 重命名格式：从服务器 JSON 文件加载，变更时自动保存
      (function () {
        var SETTINGS_URL = "/api/settings";
        var pendingTimer = null;

        function loadSettings() {
          fetch(SETTINGS_URL)
            .then(function (resp) { return resp.json(); })
            .then(function (data) {
              var rf = document.getElementById("rename_format");
              if (rf && data.rename_format) {
                rf.value = data.rename_format;
              }
              var rd = document.getElementById("rename_dir");
              if (rd && data.rename_dir) {
                rd.value = data.rename_dir;
              }
              var dc = document.getElementById("download_concurrency");
              if (dc && data.download_concurrency) {
                dc.value = data.download_concurrency;
              }
              var ck = document.getElementById("javdb_cookie");
              if (ck && data.javdb_cookie) {
                ck.value = data.javdb_cookie;
              }
              var jc = document.getElementById("jav321_cookie");
              if (jc && data.jav321_cookie) {
                jc.value = data.jav321_cookie;
              }
              var dc = document.getElementById("dmm_cookie");
              if (dc && data.dmm_cookie) {
                dc.value = data.dmm_cookie;
              }
            })
            .catch(function () {});
        }

        function saveSettingsField(key, value) {
          var body = {};
          body[key] = value;
          fetch(SETTINGS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).catch(function () {});
        }

        // HTMX 刷新预览后，从服务器加载已保存的格式
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (evt.detail && evt.detail.target && evt.detail.target.id === "result") {
            loadSettings();
          }
        });

        // 输入变更时防抖保存
        document.body.addEventListener("input", function (evt) {
          var elt = evt.target;
          if (elt && elt.id === "rename_format") {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(function () { saveSettingsField("rename_format", elt.value); }, 300);
          }
          if (elt && elt.id === "rename_dir") {
            clearTimeout(pendingTimer);
            pendingTimer = setTimeout(function () { saveSettingsField("rename_dir", elt.value); }, 300);
          }
        });

        // 提交前立即保存
        document.body.addEventListener("htmx:beforeRequest", function (evt) {
          var elt = evt.detail && evt.detail.elt;
          if (!elt || elt.id !== "write-form") return;
          var rf = document.getElementById("rename_format");
          if (rf) {
            saveSettingsField("rename_format", rf.value);
          }
          var rd = document.getElementById("rename_dir");
          if (rd) {
            saveSettingsField("rename_dir", rd.value);
          }
          var ms = document.getElementById("move_to_subdir");
          if (ms) {
            saveSettingsField("move_to_subdir", ms.checked);
          }
        });

        // move_to_subdir 变更时自动持久化
        document.addEventListener("change", function (e) {
          if (e.target && e.target.id === "move_to_subdir") {
            saveSettingsField("move_to_subdir", e.target.checked);
          }
        });

        // 页面初次加载时读取
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadSettings);
        } else {
          loadSettings();
        }
      })();

      // 写入前重命名文件数确认：超过 3 个时弹窗确认
      // 不劫持 htmx:beforeRequest（避免与任务ID注入逻辑冲突），改为劫持按钮点击
      (function () {
        var RENAME_PREVIEW_URL = "/api/rename-preview";

        window.nfCloseRenameModal = function () {
          var modal = document.getElementById("nf-rename-modal");
          if (modal) modal.style.display = "none";
        };

        window.nfConfirmRename = function () {
          var modal = document.getElementById("nf-rename-modal");
          if (modal) modal.style.display = "none";
          var form = document.getElementById("write-form");
          if (form) htmx.trigger(form, "submit");
        };

        window.nfWriteClick = function (evt) {
          evt.preventDefault();
          var form = document.getElementById("write-form");
          if (!form) return;
          var formData = new FormData(form);
          fetch(RENAME_PREVIEW_URL, { method: "POST", body: formData })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.count > 3) {
                document.getElementById("nf-rename-count").textContent = data.count;
                document.getElementById("nf-rename-modal").style.display = "";
              } else {
                htmx.trigger(form, "submit");
              }
            })
            .catch(function () {
              htmx.trigger(form, "submit");
            });
        };
      })();

      // 重命名格式预设
      (function () {
        var PRESETS_URL = "/api/presets";
        var presetSelect = null;

        function populatePresets(data) {
          presetSelect = document.getElementById("preset-select");
          if (!presetSelect) return;
          // 保留第一个 option（"-- 选择预设 --"）
          while (presetSelect.options.length > 1) {
            presetSelect.remove(1);
          }
          // 内置预设
          var firstUser = true;
          for (var key in data.built_in) {
            var opt = document.createElement("option");
            opt.value = "built_in:" + key;
            opt.textContent = key;
            presetSelect.appendChild(opt);
          }
          // 用户自定义预设
          for (var key in data.user) {
            if (firstUser) {
              var sep = document.createElement("option");
              sep.disabled = true;
              sep.textContent = "── 我的预设 ──";
              presetSelect.appendChild(sep);
              firstUser = false;
            }
            var opt = document.createElement("option");
            opt.value = "user:" + key;
            opt.textContent = key;
            presetSelect.appendChild(opt);
          }
        }

        function loadPresets() {
          fetch(PRESETS_URL)
            .then(function (r) { return r.json(); })
            .then(populatePresets)
            .catch(function () {});
        }

        window.nfApplyPreset = function (value) {
          if (!value) return;
          fetch(PRESETS_URL)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var preset;
              if (value.indexOf("built_in:") === 0) {
                preset = data.built_in[value.slice(9)];
              } else if (value.indexOf("user:") === 0) {
                preset = data.user[value.slice(5)];
              }
              if (!preset) return;
              var rf = document.getElementById("rename_format");
              var rd = document.getElementById("rename_dir");
              if (rf) rf.value = preset.rename_format;
              if (rd && preset.rename_dir) rd.value = preset.rename_dir;
            })
            .catch(function () {});
        };

        window.nfSavePreset = function () {
          var rf = document.getElementById("rename_format");
          var rd = document.getElementById("rename_dir");
          // 先确保服务器上的 rename_format / rename_dir 是最新的
          if (rf) saveSettingsField("rename_format", rf.value);
          if (rd) saveSettingsField("rename_dir", rd.value);
          var name = prompt("请输入预设名称：");
          if (!name || name.trim() === "") return;
          var formData = new FormData();
          formData.append("name", name.trim());
          formData.append("rename_format", rf ? rf.value : "");
          formData.append("rename_dir", rd ? rd.value : "");
          fetch(PRESETS_URL, {
            method: "POST",
            body: formData,
          }).then(function () {
            loadPresets();
          }).catch(function () {});
        };

        window.nfDeletePreset = function () {
          var sel = document.getElementById("preset-select");
          if (!sel || !sel.value) return;
          if (sel.value.indexOf("user:") !== 0) return;
          var name = sel.options[sel.selectedIndex].textContent;
          if (!confirm('确定删除预设"' + name + '"？')) return;
          fetch(PRESETS_URL + "?name=" + encodeURIComponent(name), {
            method: "DELETE",
          }).then(function () {
            loadPresets();
          }).catch(function () {});
        };

        // 在 settings 加载后也加载预设
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (evt.detail && evt.detail.target && evt.detail.target.id === "result") {
            setTimeout(loadPresets, 50);
          }
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadPresets);
        } else {
          loadPresets();
        }
      })();

      // 图片单击设 poster，双击设 fanart
      (function () {
        document.body.addEventListener("click", function (e) {
          var thumb = e.target.closest(".nf-image-thumb");
          if (!thumb) return;
          var option = thumb.closest(".nf-image-option");
          if (!option) return;

          if (option._clickTimer) {
            clearTimeout(option._clickTimer);
            option._clickTimer = null;
            var fanartRadio = option.querySelector(
              "input[name='fanart_url']"
            );
            if (fanartRadio) fanartRadio.checked = true;
          } else {
            option._clickTimer = setTimeout(function () {
              option._clickTimer = null;
              var posterRadio = option.querySelector(
                "input[name='poster_url']"
              );
              if (posterRadio) posterRadio.checked = true;
            }, 250);
          }
        });
      })();
    </script>
  </body>
