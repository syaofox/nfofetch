{% extends "base.html" %}

{% block content %}
  <section class="nf-card">
    <h2 class="nf-card-title">影片刮削</h2>
    <p class="nf-card-desc">
      输入影片番号（如 IPVR-335）或 javdb 页面 URL 进行搜索刮削。提交后会在该视频所在目录下生成
      Jellyfin 兼容的 <code>movie.nfo</code> 和图片。
    </p>

    <form
      id="scrape-form"
      hx-post="/scrape/fetch"
      hx-target="#result"
      hx-swap="innerHTML"
      class="nf-form"
    >
      <div class="nf-form-group">
        <label for="url" class="nf-label">影片番号或 URL</label>
        <input
          type="text"
          id="url"
          name="url"
          required
          placeholder="例如：IPVR-335 或 https://javdb.com/v/82ebmO"
          class="nf-input"
        />
      </div>

      <p class="nf-hint">
        输入番号将搜索相关影片，输入 URL 将直接刮削。
      </p>

      <button id="scrape-button" type="submit" class="nf-button">开始刮削</button>
    </form>
  </section>

  <section id="result" class="nf-result">
    <!-- HTMX 将在这里渲染刮削结果 -->
  </section>
{% endblock %}
