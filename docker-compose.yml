services:
  nfofetch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfofetch
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 浏览根目录（根据自己宿主机目录调整）
      - NFOFETCH_BROWSE_ROOT=/data/media
      # 用户设置持久化路径（JSON 文件），默认 ~/.config/nfofetch/settings.json
      - NFOFETCH_SETTINGS_PATH=/config/settings.json
      # 可选：自定义 HTTP User-Agent，避免部分站点直接 403
      # - NFOFETCH_USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:117.0) Gecko/20100101 Firefox/117.0
      # 可选：访问 javdb 时使用的 HTTP 代理，例如 http://127.0.0.1:7890
      # - NFOFETCH_HTTP_PROXY=http://127.0.0.1:7890
      # javdb Cookie（在宿主机上配置真实值，避免写死在镜像中）
      # - NFOFETCH_JAVDB_COOKIE="theme=auto; "
      # 可选：javdb 镜像域名，默认 javdb565.com。镜像变动时无需改代码。
      # - NFOFETCH_JAVDB_MIRROR=javdb565.com
      # 可选：extrafanart 最大保存数量，设为 0 完全禁用（默认 8）
      - NFOFETCH_MAX_EXTRA_IMAGES=8
      # 可选：单个 HTTP 请求超时秒数
      # - NFOFETCH_HTTP_TIMEOUT=20
      # 可选：extrafanart 批量下载总超时秒数（超时后已完成的继续保存）
      # - NFOFETCH_BATCH_TIMEOUT=120
      # 可选：日志等级（DEBUG / INFO / WARNING / ERROR）
      - NFOFETCH_LOG_LEVEL=INFO
      - NFOFETCH_SERIAL_WRITES=true
    volumes:
      # 挂载媒体库所在目录到容器内部，供浏览和写 NFO/图片（NFO 会生成在视频同目录）
      - /home/syaofox/Videos/transcode:/data/media
      # 持久化用户设置（重命名格式等）
      - ./config:/config
      # 同步宿主机时区
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    user: "${UID:-1000}:${GID:-1000}"

